[model]
arch = "looped"
vocab_size = 32768
d_model = 384
n_layers = 8
n_heads = 6
n_kv_heads = 2
ffn_hidden = 1024
max_seq_len = 512
tie_embeddings = true
rope_theta = 10000.0
n_unique_layers = 2
n_loops = 4

[train]
data_dir = "data/tokenized"
out_dir = "checkpoints/looped_16m"
batch_size = 16
grad_accum = 2
lr = 0.001
min_lr = 0.0001
warmup_steps = 300
max_steps = 10000
weight_decay = 0.1
beta1 = 0.9
beta2 = 0.95
grad_clip = 1.0
eval_interval = 1000
eval_batches = 32
log_interval = 20
save_interval = 2000
seed = 1337
